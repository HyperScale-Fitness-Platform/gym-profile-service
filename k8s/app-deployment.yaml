apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-profile-service
  namespace: gym-dev
  labels:
    app: gym-profile-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gym-profile-service
  template:
    metadata:
      labels:
        app: gym-profile-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z profile-postgres 5432; do echo "waiting for profile-postgres"; sleep 2; done;
        - name: wait-for-kafka
          image: busybox:1.35.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - until nc -z kafka-service 9092; do echo "waiting for kafka"; sleep 2; done;
      containers:
        - name: app
          image: <account-id>.dkr.ecr.<region>.amazonaws.com/gym-profile-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 4002
              name: http
          env:
            - name: PORT
              value: "4002"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: PGSSLMODE
              value: "disable"
            - name: KAFKA_BROKERS
              value: "kafka-service:9092"
          readinessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4002
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
